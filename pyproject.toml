[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ncore-up"
version = "0.7.6"
description = "AccoFIL NCUpload – automated nCore upload preparation, batch uploads and seeding (excluding XXX)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "AccoFIL"}]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "requests-cache>=1.1",
  "Pillow>=9",
  "mutagen>=1.45",
  "PyYAML>=6",
  "beautifulsoup4>=4.11",
  "langdetect>=1.0.9",
  "rapidfuzz>=3",
  "Unidecode>=1.3",
  "pefile>=2023.2.7",
]

[project.scripts]
ncupload = "ncore_up.cli:main"
ncore-up = "ncore_up.cli:main"

[project.urls]
Homepage = "https://github.com/accofil/AccoFIL-NCUpload"
Documentation = "https://github.com/accofil/AccoFIL-NCUpload/tree/main/docs"
Issues = "https://github.com/accofil/AccoFIL-NCUpload/issues"

[tool.setuptools.packages.find]
include = ["ncore_up*"]
